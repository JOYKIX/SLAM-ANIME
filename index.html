<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLAM ANIME · Grilles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="site-shell">
    <header class="topbar" aria-label="Navigation principale">
      <a class="brand" href="#create" aria-label="SLAM ANIME accueil">
        <span class="brand__mark">S</span>
        <span>SLAM ANIME</span>
      </a>
      <nav class="quick-nav">
        <a class="nav-link is-active" href="#create" data-page-link="create">Créer</a>
        <a class="nav-link" href="#saved" data-page-link="saved">Grilles</a>
        <a class="nav-link" href="#play" data-page-link="play">Jouer</a>
      </nav>
    </header>

    <main class="pages">
      <section class="page is-active" id="page-create" data-page="create" aria-labelledby="create-title">
        <div class="page-head">
          <span class="eyebrow">Création</span>
          <h1 id="create-title">Grille sombre. Rapide. Jouable.</h1>
        </div>

        <div class="creator-grid">
          <section class="panel word-builder" aria-label="Ajouter des mots">
            <div class="panel__heading">
              <h2>Mots + indices</h2>
            </div>

            <form class="add-word" id="wordForm">
              <div>
                <label for="wordName">Mot</label>
                <input id="wordName" type="text" autocomplete="off" placeholder="Naruto" />
              </div>
              <div>
                <label for="wordDescription">Description</label>
                <input id="wordDescription" type="text" autocomplete="off" placeholder="Ninja de Konoha" />
              </div>
              <button class="primary" type="submit">Ajouter</button>
            </form>

            <section class="theme-picker" aria-labelledby="theme-picker-title">
              <div class="theme-picker__head">
                <div>
                  <h3 id="theme-picker-title">Bibliothèque de thèmes</h3>
                  <p>Choisis un ou plusieurs thèmes : un même mot peut appartenir à plusieurs thèmes.</p>
                </div>
                <span id="themeSummary" class="theme-summary">0 thème</span>
              </div>
              <div id="themeLibrary" class="theme-library" aria-live="polite"></div>
              <div class="theme-actions">
                <button class="secondary" id="addThemesBtn" type="button">Ajouter les thèmes</button>
                <button class="secondary" id="replaceThemesBtn" type="button">Remplacer par thèmes</button>
                <button class="tiny" id="clearThemesBtn" type="button">Tout décocher</button>
              </div>
            </section>

            <div id="wordBank" class="word-bank" aria-live="polite"></div>
            <textarea id="words" class="raw-words" spellcheck="false" aria-label="Source des mots">ONE PIECE | Équipage au chapeau de paille
DEMON SLAYER | Pourfendeurs de démons
NARUTO | Ninja de Konoha
SAKURA | Fleur rose japonaise
DRAGON BALL | Boules de cristal
TITAN | Géant d'attaque
KAWAII | Mignon au Japon
OTAKU | Fan très investi
COSPLAY | Costume de personnage
STUDIO GHIBLI | Studio de Miyazaki
HERO | Personnage principal
SHONEN | Manga pour jeunes lecteurs
SHOJO | Manga souvent centré sur les émotions, la romance et les relations
SEINEN | Manga pensé pour un public adulte ou jeune adulte
JOSEI | Manga destiné plutôt aux jeunes femmes adultes
ISEKAI | Personnage transporté dans un autre monde
MANGAKA | Auteur ou autrice de manga
MECHA | Robot géant piloté ou autonome
OPENING | Générique d'ouverture d'un anime
ENDING | Générique de fin d'un anime</textarea>
          </section>

          <section class="panel settings" aria-label="Paramètres de grille">
            <div class="panel__heading">
              <h2>Réglages</h2>
            </div>

            <div class="grid-inputs">
              <div>
                <label for="horizontalCount">Horizontaux</label>
                <input id="horizontalCount" type="number" min="0" max="50" value="5" />
              </div>
              <div>
                <label for="verticalCount">Verticaux</label>
                <input id="verticalCount" type="number" min="0" max="50" value="5" />
              </div>
            </div>

            <div class="switches">
              <label class="checkline"><input id="hideLetters" type="checkbox" checked /> Mode jeu</label>
              <label class="checkline"><input id="randomize" type="checkbox" checked /> Mélanger</label>
            </div>

            <div class="actions">
              <button class="primary" id="generateBtn" type="button">Générer</button>
              <button class="secondary" id="saveBtn" type="button">Sauver</button>
              <button class="secondary" id="exampleBtn" type="button">Exemple</button>
              <button class="secondary" id="printBtn" type="button">Imprimer</button>
            </div>
          </section>
        </div>
      </section>

      <section class="page" id="page-saved" data-page="saved" aria-labelledby="saved-title">
        <div class="page-head page-head--inline">
          <div>
            <span class="eyebrow">Bibliothèque</span>
            <h1 id="saved-title">Grilles sauvegardées</h1>
          </div>
          <button class="tiny danger" id="clearSavesBtn" type="button">Vider</button>
        </div>
        <div id="savedList" class="saved-list saved-list--page"></div>
      </section>

      <section class="page" id="page-play" data-page="play" aria-labelledby="play-title">
        <section class="panel output" aria-live="polite">
          <div class="output__topline">
            <div>
              <span class="eyebrow">Jeu</span>
              <h1 id="play-title">Plateau</h1>
            </div>
            <div class="status" id="status">
              <div class="message">Prêt.</div>
            </div>
          </div>
          <div id="result"></div>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
